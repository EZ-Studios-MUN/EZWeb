<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Studio | 2026</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
</head>
<body>

    <div class="nav-overlay" id="nav-overlay">
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#project">The Project</a>
            <a href="#team">Our Team</a>
            <button id="theme-toggle">Toggle Dark Mode</button>
        </nav>
    </div>

    <header id="home">
        <div class="logo-container">
            <img src="./assets/img/logo.png" alt="EZ Studio Logo">
        </div>
        
        <button class="sandwich-menu" id="menu-btn" aria-label="Toggle Menu">
            <span class="bar top"></span>
            <span class="bar mid"></span>
            <span class="bar bot"></span>
        </button>
    </header>

    <main>
        <section class="hero">
            <img src="./assets/img/Hero-logo.png" alt="EZ Studio Logo" class="hero-logo">
            <p>We are EZ Studio.</p>
        </section>

        <section id="project" class="project-section">
            <h2>Current Projects</h2>
            <div class="spotlight-card">
                <div class="card-content">
                    <h3><span class="status active"></span>The Bomb Defusal Game</h3>
                    <p></p>
                    
                    <button id="view-project-btn" class="action-btn" 
                        data-title="The Bomb Defusal Game" 
                        data-desc="Our physical defusal game runs on a custom hot-swappable architecture. The core logic allows for modular puzzle components to be swapped on the fly.">
                        View Project Details
                    </button>
                </div>
            </div>
        </section>

        <section id="team" class="team-section">
            <h2>The Team</h2>
            <div class="team-grid">
                
                <div class="team-card interactive-card" 
                    data-title="Abner Zhang" 
                    data-role=""
                    data-desc="">
                    
                    <img src="./assets/img/Abner_headshot.JPG" alt="Abner Zhang" class="avatar">
                    
                    <h4>Abner Zhang</h4>
                    <p class="role">Embedded Systems & Hardware</p>
                </div>
                
                <div class="team-card interactive-card"
                    data-title="Eric Guzzwell" 
                    data-role=""
                    data-desc="">
                    
                    <img src="eric.jpg" alt="Eric Guzzwell" class="avatar">
                    
                    <h4>Eric Guzzwell</h4>
                    <p class="role">Embedded Systems & Hardware</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EZ Studio. All rights reserved.</p>
    </footer>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">&times;</button>
            <h3 id="modal-title">Title</h3>
            <p id="modal-subtitle" class="role" style="display: none;"></p>
            <div class="modal-divider"></div>
            <p id="modal-body">Content goes here...</p>
        </div>
    </div>

    <script src="./assets/js/script.js"></script>
</body>
</html>
